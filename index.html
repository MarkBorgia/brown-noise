<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Deep, rumbling brown noise generated entirely on your device. Works fully offline." />
<meta name="theme-color" content="#0b0f14" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Brown Noise</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: #0b0f14;
    color: #e8e4dc;
    min-height: 100dvh;
    padding: 32px 24px;
  }
  .card { width: 100%; max-width: 420px; margin: 0 auto; text-align: center; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.04em; color: #d9a86b; }
  .sub { font-size: 13px; color: #7d8b99; margin-top: 6px; }
  .play {
    margin: 34px auto 10px;
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 2px solid #d9a86b;
    background: transparent;
    color: #d9a86b;
    font-size: 34px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, color 0.2s, transform 0.1s;
  }
  .play.on { background: #d9a86b; color: #0b0f14; }
  .play:active { transform: scale(0.96); }
  .status { font-size: 13px; color: #7d8b99; height: 18px; margin-bottom: 22px; }
  .row { margin: 14px 0; text-align: left; }
  label { font-size: 12px; color: #9aa8b5; display: block; margin-bottom: 8px; letter-spacing: 0.06em; text-transform: uppercase; }
  label .val { float: right; color: #d9a86b; letter-spacing: 0; text-transform: none; }
  input[type="range"] { width: 100%; accent-color: #d9a86b; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    flex: 1; padding: 9px 0; font-size: 13px;
    border: 1px solid #2a3742; border-radius: 20px;
    background: transparent; color: #9aa8b5; cursor: pointer;
  }
  .chip.sel { border-color: #d9a86b; color: #d9a86b; }
  .save {
    margin-top: 26px; width: 100%;
    padding: 13px; font-size: 14px;
    border: 1px solid #2a3742; border-radius: 10px;
    background: transparent; color: #cfd8e0; cursor: pointer;
  }
  .save:disabled { opacity: 0.5; cursor: default; }
  .install { display: none; margin-top: 12px; border-color: #d9a86b; color: #d9a86b; }
  select {
    margin-top: 10px; width: 100%; padding: 10px;
    background: #141b22; color: #cfd8e0; border: 1px solid #2a3742;
    border-radius: 10px; font-size: 14px;
  }
  .tip { margin-top: 26px; font-size: 12px; color: #66727e; line-height: 1.6; }
</style>
</head>
<body>
<main class="card">
  <h1>Brown Noise</h1>
  <p class="sub">Generated on your device · loops seamlessly forever</p>

  <button id="play" class="play" aria-label="Play">&#9654;</button>
  <p id="status" class="status">Ready</p>

  <div class="row">
    <label for="vol">Volume</label>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7" />
  </div>

  <div class="row">
    <label>Sound shaping</label>
    <div class="chips" id="presets">
      <button class="chip sel" data-p="full">Full</button>
      <button class="chip" data-p="balanced">Balanced</button>
      <button class="chip" data-p="airy">Airy</button>
    </div>
  </div>

  <div class="row">
    <label for="bass">Fullness · tilt <span class="val" id="bassV">+6 dB</span></label>
    <input id="bass" type="range" min="-12" max="12" step="1" value="6" />
  </div>

  <div class="row">
    <label for="warmth">Warmth · high roll-off <span class="val" id="warmthV">4.0 kHz</span></label>
    <input id="warmth" type="range" min="0" max="100" step="1" value="68" />
  </div>

  <div class="row">
    <label for="air">Air · top shelf <span class="val" id="airV">-3 dB</span></label>
    <input id="air" type="range" min="-12" max="12" step="1" value="-3" />
  </div>

  <div class="row">
    <label for="rumble">Rumble · slow swell <span class="val" id="rumbleV">35%</span></label>
    <input id="rumble" type="range" min="0" max="80" step="1" value="35" />
  </div>

  <div class="row">
    <label for="speed">Rumble speed <span class="val" id="speedV">0.15 Hz</span></label>
    <input id="speed" type="range" min="0" max="100" step="1" value="30" />
  </div>

  <div class="row">
    <label>Sleep timer</label>
    <div class="chips" id="chips">
      <button class="chip sel" data-min="0">Off</button>
      <button class="chip" data-min="30">30 min</button>
      <button class="chip" data-min="60">1 h</button>
      <button class="chip" data-min="120">2 h</button>
    </div>
  </div>

  <button id="save" class="save">Save a loop file to your phone (WAV)</button>
  <select id="dur">
    <option value="720">12 minutes · about 32 MB</option>
    <option value="3600">1 hour · about 159 MB</option>
  </select>

  <button id="install" class="save install">Install as app on this device</button>

  <p class="tip">
    Works fully offline — the sound is generated by this page, not streamed.
    Keep this file on your phone and open it any time, no connection needed.
    The loop file you save uses whatever sound you've dialed in.
  </p>
</main>

<script>
(function () {
  "use strict";
  var playBtn = document.getElementById("play");
  var statusEl = document.getElementById("status");
  var volEl = document.getElementById("vol");
  var bassEl = document.getElementById("bass");
  var warmthEl = document.getElementById("warmth");
  var airEl = document.getElementById("air");
  var bassV = document.getElementById("bassV");
  var warmthV = document.getElementById("warmthV");
  var airV = document.getElementById("airV");
  var rumbleEl = document.getElementById("rumble");
  var speedEl = document.getElementById("speed");
  var rumbleV = document.getElementById("rumbleV");
  var speedV = document.getElementById("speedV");
  var presets = document.getElementById("presets");
  var chips = document.getElementById("chips");
  var saveBtn = document.getElementById("save");
  var durSel = document.getElementById("dur");

  var ctx = null, gain = null, src = null, loopBuf = null, bassF = null, warmF = null, airF = null, tiltF = null;
  var modGain = null, lfo1 = null, lfo2 = null, lfo1g = null, lfo2g = null;
  var playing = false, timerId = null, fadeId = null;

  // Brown noise: leaky integrator over white noise (classic warm/deep profile)
  function brownSamples(n) {
    var out = new Float32Array(n);
    var last = 0;
    for (var i = 0; i < n; i++) {
      var white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      out[i] = last * 3.5;
    }
    return out;
  }

  // Build a buffer that wraps to itself with an equal-power crossfade,
  // so looping it is perfectly gapless (no click at the loop point).
  // Crossfade sits at the start: it blends the continuation of the tail
  // into the head, so the end flows straight into the beginning.
  function seamlessLoop(seconds, sampleRate) {
    var N = Math.round(seconds * sampleRate);
    var F = Math.round(2 * sampleRate); // 2 s crossfade
    if (F > N / 4) F = Math.round(N / 4);
    var raw = brownSamples(N + F);
    var b = new Float32Array(N);
    for (var i = 0; i < F; i++) {
      var w = i / F;
      b[i] = raw[i] * Math.sin(w * Math.PI / 2) + raw[i + N] * Math.cos(w * Math.PI / 2);
    }
    for (var j = F; j < N; j++) b[j] = raw[j];
    var peak = 0;
    for (var k = 0; k < N; k++) { var a = b[k] < 0 ? -b[k] : b[k]; if (a > peak) peak = a; }
    if (peak > 0) { var g = 0.5 / peak; for (var m = 0; m < N; m++) b[m] *= g; }
    return b;
  }

  function ensureCtx() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      gain = ctx.createGain();
      gain.gain.value = parseFloat(volEl.value);
      gain.connect(ctx.destination);
      // Shaping chain: low shelf (fullness) -> gentle lowpass (warmth) -> high shelf (air)
      // Fullness is a tilt EQ: bass shelf at 250 Hz plus an opposite,
      // half-strength shelf on the mids/tops, so the effect stays audible
      // on phone speakers as well as headphones.
      bassF = ctx.createBiquadFilter();
      bassF.type = "lowshelf"; bassF.frequency.value = 250; bassF.gain.value = curBass();
      tiltF = ctx.createBiquadFilter();
      tiltF.type = "highshelf"; tiltF.frequency.value = 1000; tiltF.gain.value = -curBass() / 2;
      warmF = ctx.createBiquadFilter();
      warmF.type = "lowpass"; warmF.frequency.value = curWarmth(); warmF.Q.value = 0.5;
      airF = ctx.createBiquadFilter();
      airF.type = "highshelf"; airF.frequency.value = 3000; airF.gain.value = curAir();
      // Rumble: two slow, unsynced LFOs that swell the level like distant thunder
      modGain = ctx.createGain();
      modGain.gain.value = 1 - 0.6 * curRumble();
      lfo1 = ctx.createOscillator(); lfo1.frequency.value = curSpeed();
      lfo2 = ctx.createOscillator(); lfo2.frequency.value = curSpeed() * 2.63;
      lfo1g = ctx.createGain(); lfo1g.gain.value = 0.5 * curRumble();
      lfo2g = ctx.createGain(); lfo2g.gain.value = 0.1 * curRumble();
      lfo1.connect(lfo1g); lfo1g.connect(modGain.gain);
      lfo2.connect(lfo2g); lfo2g.connect(modGain.gain);
      lfo1.start(); lfo2.start();
      bassF.connect(warmF); warmF.connect(tiltF); tiltF.connect(airF); airF.connect(modGain); modGain.connect(gain);
      // 60 s loop, device sample rate
      loopBuf = ctx.createBuffer(1, Math.round(60 * ctx.sampleRate), ctx.sampleRate);
      loopBuf.copyToChannel(seamlessLoop(60, ctx.sampleRate), 0);
      // Silent looping <audio> keeps iOS from suspending the audio in background
      try {
        var a = document.createElement("audio");
        a.loop = true;
        a.volume = 0;
        a.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKAASAAAABAAZGF0YQAAAAA=";
        a.id = "keepalive";
        document.body.appendChild(a);
      } catch (e) {}
    }
    if (ctx.state === "suspended") ctx.resume();
  }

  function start() {
    ensureCtx();
    src = ctx.createBufferSource();
    src.buffer = loopBuf;
    src.loop = true;
    src.connect(bassF);
    src.start();
    playing = true;
    playBtn.innerHTML = "&#10074;&#10074;";
    playBtn.classList.add("on");
    statusEl.textContent = "Playing · seamless loop";
    var ka = document.getElementById("keepalive");
    if (ka) ka.play().catch(function () {});
    if (navigator.mediaSession) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "Brown Noise", artist: "Offline player", album: "Brown Noise"
        });
        navigator.mediaSession.playbackState = "playing";
      } catch (e) {}
    }
  }

  function stop() {
    if (src) { try { src.stop(); } catch (e) {} src = null; }
    playing = false;
    playBtn.innerHTML = "&#9654;";
    playBtn.classList.remove("on");
    statusEl.textContent = "Paused";
    clearTimer();
    var ka = document.getElementById("keepalive");
    if (ka) ka.pause();
    if (navigator.mediaSession) {
      try { navigator.mediaSession.playbackState = "paused"; } catch (e) {}
    }
  }

  playBtn.addEventListener("click", function () { playing ? stop() : start(); });
  volEl.addEventListener("input", function () {
    if (gain) gain.gain.setTargetAtTime(parseFloat(volEl.value), ctx.currentTime, 0.05);
  });

  // --- Sound shaping controls ---
  function curBass() { return parseFloat(bassEl.value); }
  function curWarmth() { return 200 * Math.pow(80, parseInt(warmthEl.value, 10) / 100); }
  function curAir() { return parseFloat(airEl.value); }
  function curRumble() { return parseFloat(rumbleEl.value) / 100; }
  function curSpeed() { return 0.05 * Math.pow(40, parseInt(speedEl.value, 10) / 100); }
  function updateRumble() {
    var d = curRumble();
    var hz = curSpeed();
    rumbleV.textContent = Math.round(d * 100) + "%";
    speedV.textContent = hz < 1 ? hz.toFixed(2) + " Hz" : hz.toFixed(1) + " Hz";
    if (!modGain) return;
    var t = ctx.currentTime;
    modGain.gain.setTargetAtTime(1 - 0.6 * d, t, 0.2);
    lfo1g.gain.setTargetAtTime(0.5 * d, t, 0.2);
    lfo2g.gain.setTargetAtTime(0.1 * d, t, 0.2);
    lfo1.frequency.setTargetAtTime(hz, t, 0.2);
    lfo2.frequency.setTargetAtTime(hz * 2.63, t, 0.2);
  }
  function fmtDb(v) { return (v > 0 ? "+" : "") + v + " dB"; }
  function updateLabels() {
    bassV.textContent = fmtDb(curBass());
    var hz = curWarmth();
    warmthV.textContent = hz >= 15000 ? "off" :
      (hz < 1000 ? Math.round(hz) + " Hz" : (hz / 1000).toFixed(1) + " kHz");
    airV.textContent = fmtDb(curAir());
  }
  function updateShaping() {
    updateLabels();
    if (!bassF) return;
    var t = ctx.currentTime;
    bassF.gain.setTargetAtTime(curBass(), t, 0.05);
    tiltF.gain.setTargetAtTime(-curBass() / 2, t, 0.05);
    warmF.frequency.setTargetAtTime(curWarmth(), t, 0.05);
    airF.gain.setTargetAtTime(curAir(), t, 0.05);
    updateRumble();
  }
  [bassEl, warmthEl, airEl, rumbleEl, speedEl].forEach(function (el) {
    el.addEventListener("input", function () {
      Array.prototype.forEach.call(presets.children, function (x) { x.classList.remove("sel"); });
      updateShaping();
    });
  });
  var PRESETS = {
    full: [6, 68, -3, 35, 30],     // deep, heavy, rolling
    balanced: [0, 100, 0, 0, 30],  // plain brown noise
    airy: [-6, 100, 6, 0, 45]      // lighter, thinner, more hiss
  };
  presets.addEventListener("click", function (e) {
    var c = e.target.closest(".chip");
    if (!c) return;
    var p = PRESETS[c.dataset.p];
    bassEl.value = p[0]; warmthEl.value = p[1]; airEl.value = p[2];
    rumbleEl.value = p[3]; speedEl.value = p[4];
    Array.prototype.forEach.call(presets.children, function (x) { x.classList.remove("sel"); });
    c.classList.add("sel");
    updateShaping();
  });
  updateLabels();
  updateRumble();

  // Render the current filter chain offline, for the saved WAV
  function shape(b, sr) {
    var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OAC) return Promise.resolve(b);
    try {
      var oc = new OAC(1, b.length, sr);
      var buf = oc.createBuffer(1, b.length, sr);
      buf.copyToChannel(b, 0);
      var s = oc.createBufferSource();
      s.buffer = buf;
      var f1 = oc.createBiquadFilter(); f1.type = "lowshelf"; f1.frequency.value = 250; f1.gain.value = curBass();
      var ft = oc.createBiquadFilter(); ft.type = "highshelf"; ft.frequency.value = 1000; ft.gain.value = -curBass() / 2;
      var f2 = oc.createBiquadFilter(); f2.type = "lowpass"; f2.frequency.value = curWarmth(); f2.Q.value = 0.5;
      var f3 = oc.createBiquadFilter(); f3.type = "highshelf"; f3.frequency.value = 3000; f3.gain.value = curAir();
      // Rumble in the export: LFO rates are snapped to whole cycles over the
      // file length, so the saved loop still wraps seamlessly.
      var mod = oc.createGain();
      mod.gain.value = 1 - 0.6 * curRumble();
      var D = b.length / sr;
      var l1 = oc.createOscillator(); l1.frequency.value = Math.max(1, Math.round(curSpeed() * D)) / D;
      var l2 = oc.createOscillator(); l2.frequency.value = Math.max(1, Math.round(curSpeed() * 2.63 * D)) / D;
      var q1 = oc.createGain(); q1.gain.value = 0.5 * curRumble();
      var q2 = oc.createGain(); q2.gain.value = 0.1 * curRumble();
      l1.connect(q1); q1.connect(mod.gain);
      l2.connect(q2); q2.connect(mod.gain);
      s.connect(f1); f1.connect(f2); f2.connect(ft); ft.connect(f3); f3.connect(mod); mod.connect(oc.destination);
      s.start(0);
      l1.start(0); l2.start(0);
      return oc.startRendering().then(function (r) {
        var out = r.getChannelData(0);
        var peak = 0;
        for (var i = 0; i < out.length; i++) { var a = out[i] < 0 ? -out[i] : out[i]; if (a > peak) peak = a; }
        if (peak > 0) { var g = 0.5 / peak; for (var j = 0; j < out.length; j++) out[j] *= g; }
        return out;
      });
    } catch (e) {
      return Promise.resolve(b);
    }
  }

  function clearTimer() {
    if (timerId) { clearTimeout(timerId); timerId = null; }
    if (fadeId) { cancelAnimationFrame(fadeId); fadeId = null; }
  }

  function setTimer(min) {
    clearTimer();
    if (min === 0) return;
    var ms = min * 60 * 1000;
    timerId = setTimeout(function () {
      if (!playing) return;
      // gentle 30 s fade-out, then stop
      var t0 = ctx.currentTime;
      gain.gain.setValueAtTime(gain.gain.value, t0);
      gain.gain.linearRampToValueAtTime(0.0001, t0 + 30);
      timerId = setTimeout(function () { stop(); gain.gain.value = parseFloat(volEl.value); }, 30500);
    }, ms - 30000 > 0 ? ms - 30000 : 0);
    statusEl.textContent = "Playing · stops in " + (min >= 60 ? min / 60 + " h" : min + " min");
  }

  chips.addEventListener("click", function (e) {
    var c = e.target.closest(".chip");
    if (!c) return;
    Array.prototype.forEach.call(chips.children, function (x) { x.classList.remove("sel"); });
    c.classList.add("sel");
    setTimer(parseInt(c.dataset.min, 10));
    if (playing && parseInt(c.dataset.min, 10) === 0)
      statusEl.textContent = "Playing · seamless loop";
  });

  // --- WAV export: a long file whose end flows into its start, so
  // --- "repeat one" in any player loops without a click or dip.
  saveBtn.addEventListener("click", function () {
    var seconds = parseInt(durSel.value, 10);
    saveBtn.disabled = true;
    saveBtn.textContent = "Generating…";

    setTimeout(function () {
      var SR = 22050;
      shape(seamlessLoop(seconds, SR), SR).then(function (b) {
      try {
        var N = b.length;
        var wav = new ArrayBuffer(44 + N * 2);
        var v = new DataView(wav);
        function str(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
        str(0, "RIFF"); v.setUint32(4, 36 + N * 2, true); str(8, "WAVE");
        str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
        v.setUint16(22, 1, true); v.setUint32(24, SR, true);
        v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
        str(36, "data"); v.setUint32(40, N * 2, true);
        for (var i = 0; i < N; i++) {
          var s = b[i];
          v.setInt16(44 + i * 2, s < -1 ? -32768 : s > 1 ? 32767 : (s * 32767) | 0, true);
        }
        var blob = new Blob([wav], { type: "audio/wav" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "brown-noise-" + (seconds / 60) + "min.wav";
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
        saveBtn.textContent = "Saved — set it to repeat in your player";
      } catch (err) {
        saveBtn.textContent = "Could not generate — try a shorter length";
      }
      setTimeout(function () {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save a loop file to your phone (WAV)";
      }, 3500);
      });
    }, 50);
  });

  // --- PWA: install prompt + offline service worker ---
  var deferredPrompt = null;
  var installBtn = document.getElementById("install");
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
  });
  installBtn.addEventListener("click", function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () { deferredPrompt = null; });
    installBtn.style.display = "none";
  });
  window.addEventListener("appinstalled", function () { installBtn.style.display = "none"; });
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
